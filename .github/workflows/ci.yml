name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DATABASE_URL: postgres://oportfolio:oportfolio_dev@localhost:5432/oportfolio
  APP_BASE_URL: http://localhost:3000

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Dependency audit (production tree)
        run: pnpm audit:prod
      - name: OpenAPI drift check
        run: |
          pnpm openapi:generate
          git diff --exit-code docs/openapi.json

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan history for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: false
          load: true
          tags: oportfolio-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: false
          load: true
          tags: oportfolio-worker:ci
          cache-from: type=gha
      - name: Scan web image for known vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: oportfolio-web:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start services (ClamAV excluded — scan pipeline is covered locally)
        run: docker compose up -d --wait postgres minio minio-init mailpit
      - name: Migrate, import framework, seed
        run: |
          pnpm db:migrate
          pnpm framework:import spec/frameworks/fcai/v3.2/framework.json --publish
          pnpm seed
      - run: pnpm test:integration
      - name: Build and start app + worker
        run: |
          cp .env.example .env
          pnpm build
          nohup pnpm start > app.log 2>&1 &
          nohup pnpm worker > worker.log 2>&1 &
          until curl -sf http://localhost:3000/sign-in > /dev/null; do sleep 1; done
      - run: pnpm test:authz
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm verify:audit-chain
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            test-results/
            app.log
            worker.log
          retention-days: 7
