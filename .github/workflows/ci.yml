name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start services
        run: docker compose up -d postgres minio minio-init mailpit
      - name: Wait for Postgres
        run: until docker compose exec -T postgres pg_isready -U oportfolio; do sleep 1; done
      - name: Migrate (forward-apply on empty database)
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://oportfolio:oportfolio_dev@localhost:5432/oportfolio
      - run: pnpm test:integration
        env:
          DATABASE_URL: postgres://oportfolio:oportfolio_dev@localhost:5432/oportfolio
      - run: pnpm test:authz
        env:
          DATABASE_URL: postgres://oportfolio:oportfolio_dev@localhost:5432/oportfolio
      - name: Verify audit chain
        run: pnpm verify:audit-chain
        env:
          DATABASE_URL: postgres://oportfolio:oportfolio_dev@localhost:5432/oportfolio
