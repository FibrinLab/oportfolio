name: oportfolio

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: oportfolio
      POSTGRES_PASSWORD: oportfolio_dev
      POSTGRES_DB: oportfolio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oportfolio -d oportfolio"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: oportfolio
      MINIO_ROOT_PASSWORD: oportfolio_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 oportfolio oportfolio_dev &&
      mc mb --ignore-existing local/oportfolio-quarantine &&
      mc mb --ignore-existing local/oportfolio-clean &&
      mc anonymous set none local/oportfolio-quarantine &&
      mc anonymous set none local/oportfolio-clean
      "

  clamav:
    image: clamav/clamav:latest
    ports:
      - "3310:3310"
    volumes:
      - clamdb:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  pgdata:
  miniodata:
  clamdb:
